services:
  - type: web
    name: scout-storage-api
    runtime: node
    plan: free
    branch: english-role-videos
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: 1
      - key: MONGODB_URI
        sync: false
      - key: COOKIE_SAME_SITE
        value: lax
